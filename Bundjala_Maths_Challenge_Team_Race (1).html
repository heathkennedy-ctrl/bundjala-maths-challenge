<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bundjala Maths Challenge | Team Race</title><style>
:root{font-family:Arial,sans-serif;color:#192b40;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:14px}header{text-align:center}h1{font-size:clamp(24px,3vw,42px);margin:6px}p{margin:5px}.toolbar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px auto}.toolbar select,.toolbar button{font-size:18px;padding:10px;border-radius:9px;border:1px solid #9caabd}button{cursor:pointer}#start{background:#183f70;color:white;font-weight:bold}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{border:5px solid var(--team);border-radius:20px;background:white;padding:12px;text-align:center;min-width:0}.team h2{font-size:clamp(20px,2.5vw,32px);margin:3px;color:var(--team)}.score{font-size:clamp(30px,4vw,56px);font-weight:900}.progress{background:#e4e8ef;height:15px;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:var(--team);width:0}.board{width:min(100%,330px);height:310px;position:relative;margin:10px auto}.num{position:absolute;left:var(--x);top:var(--y);width:clamp(66px,8vw,92px);height:clamp(66px,8vw,92px);border-radius:50%;border:4px solid var(--team);background:white;font-size:clamp(23px,3vw,33px);font-weight:bold;color:#192b40}.num.selected{background:#c8efda;border-color:#16824e}.actions{display:flex;gap:10px;justify-content:center}.actions button{padding:12px 16px;border-radius:10px;font-size:clamp(16px,2vw,22px);font-weight:bold;border:1px solid #b7c3d1}.check{background:var(--team);color:white}.check:disabled{opacity:.4}.feedback{font-size:clamp(15px,1.8vw,21px);min-height:54px;font-weight:bold;margin:10px auto}.winner{text-align:center;font-size:34px;font-weight:900;padding:14px;background:#fff4cf;border-radius:16px;margin:10px auto}.note{text-align:center;font-size:15px;margin:10px}@media(max-width:560px){body{padding:5px}.team{padding:5px}.board{height:240px}.num{width:56px;height:56px;font-size:20px}.actions button{padding:8px 5px}.feedback{min-height:65px}}
</style></head><body><header><h1>Bundjala Maths Challenge</h1><p>Two-team number race • Find three numbers where two add to the third</p></header><div class="toolbar"><label>Level <select id="level"><option value="D">Working Below (D)</option><option value="C" selected>Working At (C)</option><option value="AB">Working Above (A–B)</option></select></label><label>First to <select id="goal"><option>5</option><option selected>10</option><option>15</option><option>20</option></select> correct</label><button id="start">Start / Restart Race</button></div><div id="winner" class="winner" hidden></div><main class="teams"><section class="team" style="--team:#1677c0" id="team0"><h2>BLUE TEAM</h2><div class="score" id="score0">0</div><div class="progress"><div id="bar0"></div></div><div class="board" id="board0"></div><div class="feedback" id="feedback0">Ready to play</div><div class="actions"><button class="check" id="check0" disabled>Check Answer</button><button id="clear0">Clear</button></div></section><section class="team" style="--team:#d77924" id="team1"><h2>ORANGE TEAM</h2><div class="score" id="score1">0</div><div class="progress"><div id="bar1"></div></div><div class="board" id="board1"></div><div class="feedback" id="feedback1">Ready to play</div><div class="actions"><button class="check" id="check1" disabled>Check Answer</button><button id="clear1">Clear</button></div></section></main><p class="note">One student from each team selects three circles and checks. After a correct answer, the next student takes over. First team to the target wins.</p><script>
const $=id=>document.getElementById(id);let goal=10,level='C',over=false;let teams=[];const ranges={D:[1,10,20],C:[8,48,95],AB:[25,190,380]};
function factCount(ns){let c=0;for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++)if(ns.includes(ns[i]+ns[j]))c++;return c}
function puzzle(){let [lo,hi,limit]=ranges[level];for(let k=0;k<4000;k++){let a=lo+Math.floor(Math.random()*(hi-lo+1)),b=lo+Math.floor(Math.random()*(hi-lo+1)),sum=a+b;if(a===b||sum>limit)continue;let ns=[a,b,sum];for(let z=0;z<70&&ns.length<5;z++){let n=lo+Math.floor(Math.random()*(limit-lo+1));if(!ns.includes(n))ns.push(n)}if(ns.length===5&&factCount(ns)===1){for(let i=4;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ns[i],ns[j]]=[ns[j],ns[i]]}return ns}}return level==='D'?[2,3,5,9,14]:level==='C'?[12,19,31,44,58]:[46,78,124,167,205]}
function render(t){let s=teams[t],b=$('board'+t);b.innerHTML='';const coords=[[5,5],[69,5],[37,36],[5,69],[69,69]];s.ns.forEach((n,i)=>{let btn=document.createElement('button');btn.className='num'+(s.picks.includes(i)?' selected':'');btn.textContent=n;btn.style.setProperty('--x',coords[i][0]+'%');btn.style.setProperty('--y',coords[i][1]+'%');btn.disabled=over;btn.onclick=()=>{if(over)return;if(s.picks.includes(i))s.picks=s.picks.filter(j=>j!==i);else if(s.picks.length<3)s.picks.push(i);render(t)};b.appendChild(btn)});$('score'+t).textContent=s.score;$('bar'+t).style.width=100*s.score/goal+'%';$('check'+t).disabled=over||s.picks.length!==3}
function reset(){level=$('level').value;goal=Number($('goal').value);over=false;$('winner').hidden=true;teams=[0,1].map(()=>({score:0,picks:[],ns:puzzle()}));for(let t=0;t<2;t++){$('feedback'+t).textContent='Select three numbers';render(t)}}
function check(t){let s=teams[t];if(over||s.picks.length!==3)return;let a=s.picks.map(i=>s.ns[i]).sort((x,y)=>x-y);if(a[0]+a[1]===a[2]){s.score++;$('feedback'+t).textContent=`Correct! ${a[0]} + ${a[1]} = ${a[2]}. Next player!`;s.picks=[];if(s.score>=goal){over=true;$('winner').hidden=false;$('winner').textContent=(t===0?'🏆 BLUE':'🏆 ORANGE')+' TEAM WINS!'}else s.ns=puzzle()}else{$('feedback'+t).textContent='Try again. Look for two numbers that add to a third.';s.picks=[]}render(0);render(1)}
$('start').onclick=reset;for(let t=0;t<2;t++){$('check'+t).onclick=()=>check(t);$('clear'+t).onclick=()=>{teams[t].picks=[];$('feedback'+t).textContent='Select three numbers';render(t)}}reset();
</script></body></html>
